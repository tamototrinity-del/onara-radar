<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>おならレーダー</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #f7f5f0;
    font-family: 'Hiragino Sans', 'Yu Gothic', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0;
    color: #1a1a1a;
  }

  /* 共通ヘッダー（個体詳細の黒帯 .ov-head を正として全画面で共通化） */
  .app-head {
    position: sticky; top: 0; z-index: 20;
    width: 100%;
    background: #2a2a2a; color: #fff;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px;
  }
  .app-head .ah-left, .app-head .ah-right { flex: 0 0 88px; display: flex; align-items: center; }
  .app-head .ah-right { justify-content: flex-end; }
  .app-head .ah-title { flex: 1; text-align: center; font-size: 16px; font-weight: 700; letter-spacing: 0.04em; }
  .ah-link { background: transparent; border: none; color: #cfc9c0; font-size: 14px; font-weight: 600; letter-spacing: 0.03em; cursor: pointer; padding: 0; }
  .ah-link:active { color: #fff; }

  /* 本文（ヘッダー下のコンテンツ領域） */
  .content { width: 100%; display: flex; flex-direction: column; align-items: center; padding: 22px 16px 48px; }

  /* ステータス表示（診断フロー中のみ表示。既定は非表示） */
  .status-bar {
    width: 100%;
    max-width: 360px;
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 16px;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.05em;
    transition: all 0.3s;
    display: none;
  }
  .status-idle    { background: #e8e4de; color: #666; }
  .status-measure { background: #fff3cd; color: #856404; }
  .status-wait    { background: #d1ecf1; color: #0c5460; }
  .status-rec     { background: #f8d7da; color: #721c24; animation: pulse 0.8s infinite; }
  .status-done    { background: #d4edda; color: #155724; }
  .status-error   { background: #f8d7da; color: #721c24; }

  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  /* ボタン */
  .btn {
    width: 100%;
    max-width: 360px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 16px;
    transition: all 0.15s;
    letter-spacing: 0.05em;
  }
  .btn-start { background: #2a2a2a; color: #fff; }
  .btn-start:active { transform: scale(0.97); }
  .btn-reset { background: #e8e4de; color: #444; font-size: 13px; padding: 10px; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* レベルメーター */
  .level-wrap {
    width: 100%;
    max-width: 360px;
    margin-bottom: 16px;
    display: none;
  }
  .level-label { font-size: 11px; color: #888; margin-bottom: 4px; }
  .level-bar-bg {
    width: 100%;
    height: 8px;
    background: #ddd;
    border-radius: 4px;
    overflow: hidden;
  }
  .level-bar-fill {
    height: 100%;
    border-radius: 4px;
    background: #2a2a2a;
    width: 0%;
    transition: width 0.05s;
  }

  /* 波形モニタ（録音中の計測器readout。中央ゾーンに据える独立コンポーネント） */
  .scope-wrap {
    width: 100%;
    max-width: 360px;
    margin-bottom: 16px;
    display: none;
  }
  .scope-wrap.show { display: block; }
  #scope {
    display: block;
    width: 100%;
    height: 132px;
    background: #f2efe8;
    border: 1px solid #e2ddd3;
  }

  /* キャラ */
  .char-stage {
    width: 200px;
    height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 8px;
  }

  .note-key { display: inline-block; font-size: 28px; font-weight: 800; color: #2a2a2a; }
  .note-zodiac { font-size: 13px; color: #666; margin-bottom: 16px; text-align: center; }

  /* レーダー */
  .radar-wrap { width: 200px; height: 200px; margin: 0 auto 20px; }

  /* 諸元 */
  .specs {
    width: 100%;
    max-width: 360px;
    border: 1px solid #e0ddd8;
    border-radius: 8px;
    overflow: hidden;
    background: #fff;
    display: none;
  }
  .specs-title { background: #2a2a2a; color: #fff; font-size: 11px; letter-spacing: 0.12em; padding: 8px 14px; }
  .spec-row { display: flex; justify-content: space-between; padding: 10px 14px; font-size: 15px; border-bottom: 1px solid #eae6df; }
  .spec-row:last-child { border-bottom: none; }
  .spec-key { color: #2e2e2e; font-weight: 600; }
  .spec-val { font-weight: 700; color: #1a1a1a; font-size: 16px; font-variant-numeric: tabular-nums; }

  .invalid-msg {
    width: 100%;
    max-width: 360px;
    text-align: center;
    color: #a00;
    font-size: 13px;
    padding: 12px;
    display: none;
  }
</style>
</head>
<body>

<!-- 共通ヘッダー（左：ナビ｜中央：タイトル｜右：住人名簿リンク） -->
<header class="app-head">
  <div class="ah-left"></div>
  <div class="ah-title" data-i18n="appTitle"></div>
  <div class="ah-right"><button id="btn-dex-open" class="ah-link" data-i18n="dexOpen"></button></div>
</header>

<div class="content">

<div class="status-bar status-idle" id="status" data-i18n="statusIdle"></div>

<button class="btn btn-start" id="btn-start" data-i18n="btnStart"></button>

<div class="level-wrap" id="level-wrap">
  <div class="level-label" data-i18n="levelLabel"></div>
  <div class="level-bar-bg"><div class="level-bar-fill" id="level-fill"></div></div>
</div>

<!-- 波形モニタ（録音中の中央ゾーン。将来「舞台」に育てる独立レイヤー） -->
<div class="scope-wrap" id="scope-wrap"><canvas id="scope"></canvas></div>

<div class="invalid-msg" id="invalid-msg" data-i18n="invalidMsg"></div>

<!-- 診断結果（3ページ分割） -->
<div id="result" style="display:none; width:100%;">
  <div class="slider-vp">
    <div class="slider" id="slider">

      <!-- 1p: 音階カード ＋ 諸元（6項目のみ。干支・タイプ・キャラは出さない） -->
      <div class="page">
        <div class="note-card">
          <div class="note-card-label" data-i18n="noteCardLabel"></div>
          <div class="note-card-val" id="note-display">—</div>
        </div>
        <div class="specs" id="specs" style="display:block;">
          <div class="specs-title" data-i18n="specsTitle"></div>
          <div class="spec-row"><span class="spec-key" data-i18n="specSize"></span><span class="spec-val" id="d-size">—</span></div>
          <div class="spec-row"><span class="spec-key" data-i18n="specLength"></span><span class="spec-val" id="d-length">—</span></div>
          <div class="spec-row"><span class="spec-key" data-i18n="specWet"></span><span class="spec-val" id="d-wet">—</span></div>
          <div class="spec-row"><span class="spec-key" data-i18n="specHeavy"></span><span class="spec-val" id="d-heavy">—</span></div>
          <div class="spec-row"><span class="spec-key" data-i18n="specSharp"></span><span class="spec-val" id="d-sharp">—</span></div>
          <div class="spec-row"><span class="spec-key" data-i18n="specStable"></span><span class="spec-val" id="d-stable">—</span></div>
        </div>
        <div class="pg-hint" data-i18n="pgHint"></div>
      </div>

      <!-- 2p: レーダーのみ ＋ 姿を見るボタン -->
      <div class="page">
        <div class="radar-wrap"><canvas id="radar" width="200" height="200"></canvas></div>
        <button class="btn" id="btn-reveal" data-i18n="btnReveal" style="background:#2a2a2a; color:#fff;"></button>
      </div>

      <!-- 3p: 出現 ＋ キャラ ＋ 干支 ＋ タイプ -->
      <div class="page">
        <div class="reveal-msg" id="reveal-msg" data-i18n="revealMsg"></div>
        <div class="char-stage"><svg id="mouse-svg" width="190" height="190" viewBox="-100 -100 200 200" xmlns="http://www.w3.org/2000/svg"></svg></div>
        <div class="note-zodiac" id="zodiac-display" style="font-size:20px; font-weight:700; color:#2a2a2a; margin-bottom:6px;">—</div>
        <div class="reveal-type" id="reveal-type"></div>
        <button class="btn btn-dex-register" id="btn-dex-register" data-i18n="btnRegister" style="background:#3a6a4a; color:#fff;"></button>
        <button class="btn" id="btn-share-result" data-i18n="btnShare" style="background:#e8e4de; color:#3a3a3a; margin-top:-8px;"></button>
      </div>

    </div>
  </div>
  <div class="dots" id="dots"><span></span><span></span><span></span></div>
  <button class="btn btn-reset" id="btn-reset" data-i18n="btnReset" style="margin-top:4px;"></button>
</div>

<div id="log-status" style="width:100%; max-width:360px; text-align:center; font-size:11px; color:#888; margin-top:8px; min-height:14px;"></div>

</div><!-- /.content -->

<style>

  .dex-cell { background:#fff; border:1px solid #e0ddd8; border-radius:12px; padding:6px 4px 8px; text-align:center; position:relative; min-height:150px; }

  .reveal-msg { font-size:13px; color:#5a5148; letter-spacing:0.04em; text-align:center; margin:2px 0 6px; }
  /* 診断結果の3ページスライダー */
  .slider-vp { width:100%; max-width:380px; margin:0 auto; overflow:hidden; }
  .slider { display:flex; transition:transform 0.3s ease; }
  .page { flex:0 0 100%; display:flex; flex-direction:column; align-items:center; padding:2px 8px 0; }
  .note-card { background:#fff; border:1px solid #e0ddd8; border-radius:14px;

  .reveal-type { display:inline-block; font-size:12px; font-weight:700; color:#fff; padding:2px 12px; border-radius:10px; margin-bottom:12px; }
  .dots { display:flex; gap:8px; justify-content:center; margin:14px 0 8px; }

  /* 詳細 */
  .detail-body { max-width:380px; margin:0 auto; padding:16px; text-align:center; }
  .detail-heading { display:flex; align-items:center; justify-content:center; gap:10px; margin:2px 0 8px; }
  .detail-name { font-size:26px; font-weight:800; color:#2a2a2a; letter-spacing:0.04em; }
  .detail-body .char-stage { width:210px; height:210px; margin:0 auto 4px; display:flex; align-items:center; justify-content:center; }
  .detail-date { font-size:12px; color:#888; margin-top:8px; }

  .detail-heading .detail-type-badge { font-size:13px; padding:3px 12px; }
  /* 入れ替え確認 */
  #swap-overlay { z-index:40; background:rgba(20,18,16,0.55); display:none; align-items:center; justify-content:center; }
  #swap-overlay.show { display:flex; }
  .swap-box { background:#f7f5f0; border-radius:14px; padding:18px 16px; max-width:360px; width:90%; text-align:center; }
  .swap-title { font-size:14px; font-weight:700; margin-bottom:12px; }
  .swap-compare { display:flex; align-items:center; justify-content:center; gap:6px; }
  .swap-side { flex:1; }
  .swap-side svg { width:110px; height:110px; }
  .swap-lbl { font-size:11px; color:#888; }

  .swap-btns { display:flex; gap:10px; margin-top:14px; }
  .swap-btns .btn { margin:0; flex:1; padding:12px; }
</style>

    <div class="detail-date" id="detail-date"></div>
    <button class="btn" id="btn-share-detail" data-i18n="btnShare" style="background:#3a6a4a; color:#fff; max-width:504px; margin:14px auto 0;"></button>

    <div class="swap-title" id="swap-title" data-i18n="swapTitleDefault"></div>
    <div class="swap-compare">

  </div>

<script>
const NOTES    = ['A','A#','B','C','C#','D','D#','E','F','F#','G','G#'];
const ZODIACS  = ['子（ね）','丑（うし）','寅（とら）','卯（う）','辰（たつ）','巳（み）','午（うま）','未（ひつじ）','申（さる）','酉（とり）','戌（いぬ）','亥（い）'];

// ===== UI表示テキストの集約辞書（将来の多言語対応の土台） =====
// UIに出る日本語はすべてここに集約する。コード各所へのベタ書きはしない。
//   静的HTML … 要素に data-i18n="キー" を付け、applyStaticText() が流し込む。
//   動的テキスト … t('キー', ...args) で参照（値が関数なら引数を渡して文字列を得る）。
// 英語版を足すときは STR.en = { ... } を追加して LANG を切り替える／自動判定するだけ。
let LANG = 'ja';
const STR = {
  ja: {
    // --- 静的UI（data-i18n で適用）---
    docTitle:      'おならレーダー',
    appTitle:      'おならレーダー',
    btnStart:      '🎙 診断開始',
    levelLabel:    '入力レベル',
    invalidMsg:    '⚠ 有効な音が検出されませんでした。もう一度お試しください。',
    noteCardLabel: '音階',
    specsTitle:    '診断諸元',
    specSize:      '大きさ',
    specLength:    '長さ',
    specWet:       '湿り気',
    specHeavy:     '重厚感',
    specSharp:     'キレのよさ',
    specStable:    '安定感',
    specNote:      '音階',
    specType:      'タイプ',
    pgHint:        '← スワイプ →',
    btnReveal:     '姿を見る',
    revealMsg:     'あなたの中の住人が姿を現しました',
    btnRegister:   '記録する',
    btnShare:      '📤 シェア',
    btnReset:      'もう一度',
    dexOpen:       '住人名簿 ›',
    dexClose:      '✕ 閉じる',
    dexTitle:      '住人名簿',
    detailBack:    '‹ 住人名簿',
    detailTitleDefault: '個体詳細',
    swapTitleDefault:   'このスロットには既に住人がいます。入れ替えますか？',
    swapCurLabel:  '現在の住人',
    swapNewLabel:  '新しい住人',
    swapYes:       '入れ替える',
    swapNo:        'やめる',
    // --- ステータス・エラー（JSから t() で参照）---
    statusIdle:      'マイクボタンを押して開始',
    statusMeasuring: '環境ノイズを計測中… 静かにお待ちください',
    statusWaiting:   '準備完了 — いつでもどうぞ 🎯',
    statusRecording: '● 録音中…',
    statusAnalyzing: '解析中…',
    statusDone:      '診断完了',
    errNoSound:      '音が検出されませんでした',
    errNoFart:       '有効な屁音が検出されませんでした',
    errMicDenied:    'マイクへのアクセスが拒否されました',
    sharePreparing:  '画像を作成中…',
    shareFailed:     '画像の生成に失敗しました',
    // --- 引数つき可変メッセージ ---
    recorded:       name => `記録しました（${name}）`,
    swapped:        name => `入れ替えました（${name}）`,
    swapTitle:      name => `${name}のスロットには既に住人がいます。入れ替えますか？`,
    detailDate:     d => `記録日 ${d}`,
    typeWithPeriod: (type, p) => `${type}（周期性 ${p}）`,
    shareText:      (animal, type) => `私の中から${animal}の${type}が姿を現しました`,
    // --- 表示ラベル群 ---
    typeLabels:  { '王子':'王子', '王女':'王女', '野良':'野良' },
    animals:     ['ねずみ','うし','とら','うさぎ','りゅう','へび','うま','ひつじ','さる','とり','いぬ','いのしし'],
    radarLabels: ['大きさ','長さ','湿り気','重厚感','キレ','安定感'],
  },
};
// テキスト取得。関数値なら引数を渡して評価。未定義キーは ja→キー名の順にフォールバック。
function t(key, ...args) {
  const dict = STR[LANG] || STR.ja;
  let v = (dict[key] != null) ? dict[key] : STR.ja[key];
  if (v == null) return key;
  return typeof v === 'function' ? v(...args) : v;
}
// タイプ名の表示ラベル（内部キー 王子/王女/野良 は不変、表示だけ辞書経由）
function typeLabel(type) { const m = (STR[LANG] || STR.ja).typeLabels || STR.ja.typeLabels; return (m && m[type]) || type; }
// data-i18n を持つ静的要素へ辞書テキストを流し込む（DOM構築後に一度呼ぶ）
function applyStaticText() {
  document.title = t('docTitle');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const s = t(el.getAttribute('data-i18n'));
    if (s != null) el.textContent = s;
  });
}

// 住人の呼び名（動物名）。表示は辞書から取得。内部データ用の識別には ZODIACS を使う。
const ANIMALS = t('animals');

// 有効範囲
const VALID_FREQ_MIN = 50;
const VALID_FREQ_MAX = 200;
const VALID_DUR_MIN  = 0.1;
const VALID_DUR_MAX  = 10.0;   // 足切り上限（スコア正規化とは別）
const NOISE_MARGIN_DB = 12;    // ノイズフロア+これ以上で本体（検出のみ。大きさスコアには使わない）

// ===== analyze-batch.js と一致させた確定チューニング値 =====
// 大きさ：絶対dB(dBFS)。環境ノイズは差し引かない。-38/-12 も試せるよう定数化。
const SIZE_DB_MIN = -50;
const SIZE_DB_MAX = -10;
// 大きさの「表示のみ」の換算オフセット（内部計算/スコアは不変）。dBFS+この値で日常の音圧感覚に近いプラス表記に。
const DB_DISPLAY_OFFSET = 90;
function fmtDb(dbfs){ return (dbfs + DB_DISPLAY_OFFSET).toFixed(1) + ' dB'; }
// 長さ：足切り10sとは別に 0.1〜LEN_SCORE_MAX_SEC で正規化
const LEN_SCORE_MAX_SEC = 2.0;
// 安定感：RMS窓0.03s、CVを 0.3〜2.7 で正規化
const STABLE_WIN_SEC = 0.03;
const STABLE_CV_MIN  = 0.3;
const STABLE_CV_MAX  = 2.7;
// キレ：log10(riseRate) を 1.0〜4.0 で正規化
const SHARP_LOG_MIN = 1.0;
const SHARP_LOG_MAX = 4.0;
const RISE_CAP = 1e6;
// 音程：YIN法
const YIN_F0_MIN = 50;
const YIN_F0_MAX = 350;
const YIN_W = 2048;
const YIN_THRESHOLD = 0.15;
// period(周期性)→タイプ判定の3分割（暫定閾値・表示はしない。内部保持＋記録用）
const PERIOD_TYPE_HI = 0.55;  // これ以上→王子（実データ24件の3分位で均等化）
const PERIOD_TYPE_LO = 0.33;  // これ未満→野良（間→王女）

let audioCtx, analyser, source, stream;
let noiseFloorDb = -60;
let state = 'idle'; // idle | measuring | waiting | recording | done

const btnStart  = document.getElementById('btn-start');
const btnReset  = document.getElementById('btn-reset');
const statusEl  = document.getElementById('status');
const levelWrap = document.getElementById('level-wrap');
const levelFill = document.getElementById('level-fill');

// ステータス帯は診断フロー中だけ表示。setStatus で自動的に表示、hideStatus で隠す。
function setStatus(msg, cls) {
  statusEl.textContent = msg;
  statusEl.className = 'status-bar ' + cls;
  statusEl.style.display = 'block';
}
function hideStatus() { statusEl.style.display = 'none'; }

// ===== 声紋モニタ（スペクトログラム readout）：黒×ベージュのモノクロ記録紙。台座・キャラとは別canvasの独立レイヤー。 =====
// 横軸=時間（紙送りスクロール）／縦軸=周波数／濃淡=エネルギー強度。データ源は getFloatFrequencyData（FFT）1フレーム=1列。
// SPEC は実機で詰める前提のチューニング値（濃淡・速度・帯域・解像度・記録面）。後から触りやすいよう1箇所に集約。
const SPEC = {
  COLS: 150,       // 時間解像度（横に流れる列数）
  ROWS: 112,       // 周波数解像度（縦の分解能）
  COL_MS: 45,      // 1列を刻む間隔[ms]（大きいほどゆっくり紙送り）
  FREQ_MIN: 0,     // 縦軸 下端の周波数[Hz]
  FREQ_MAX: 1400,  // 縦軸 上端の周波数[Hz]（声紋らしく見える帯域幅）
  DB_FLOOR: -95,   // これ以下は無地（ベージュ）
  DB_CEIL: -38,    // これ以上は最濃（黒インク）
  GAMMA: 0.85,     // 濃淡カーブ（<1で中間を濃いめに）
  SMOOTH: true,    // 記録面の補間（柔らかいインク調）
  BODY_RED: '#b5352e',  // 本体区間の指摘マーカー（事務的な赤・細線のみ）
};
const Scope = (function () {
  const BEIGE = [242, 239, 232], INK = [42, 42, 42];
  let canvas = null, ctx = null, dpr = 1, W = 0, H = 0, raf = null;
  let buf = null, bctx = null, colImg = null;    // オフスクリーン記録面(COLS×ROWS)＋1列分ImageData
  let getFreq = null, binHz = 1, mode = 'wait';
  let whead = 0, totalCols = 0, lastColAt = 0;
  let bodyStart = null, bodyEnd = null;           // 本体区間（列シーケンス番号で保持）
  function ensure() {
    if (!canvas) {
      canvas = document.getElementById('scope'); ctx = canvas.getContext('2d');
      buf = document.createElement('canvas'); buf.width = SPEC.COLS; buf.height = SPEC.ROWS;
      bctx = buf.getContext('2d'); colImg = bctx.createImageData(1, SPEC.ROWS);
    }
    dpr = window.devicePixelRatio || 1;
    const cssW = canvas.clientWidth || 320, cssH = canvas.clientHeight || 132;
    if (canvas.width !== Math.round(cssW * dpr) || canvas.height !== Math.round(cssH * dpr)) {
      canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr);
    }
    W = cssW; H = cssH;
  }
  function fillBeige(c, w, h) { c.fillStyle = `rgb(${BEIGE[0]},${BEIGE[1]},${BEIGE[2]})`; c.fillRect(0, 0, w, h); }
  function pushColumn() {
    const f = getFreq ? getFreq() : null;
    const d = colImg.data, span = SPEC.FREQ_MAX - SPEC.FREQ_MIN;
    for (let y = 0; y < SPEC.ROWS; y++) {
      const freq = SPEC.FREQ_MAX - (y / (SPEC.ROWS - 1)) * span;   // 上端=高域, 下端=低域
      let dens = 0;
      if (f) {
        const bin = Math.max(0, Math.min(f.length - 1, Math.round(freq / binHz)));
        let t = (f[bin] - SPEC.DB_FLOOR) / (SPEC.DB_CEIL - SPEC.DB_FLOOR);
        if (t < 0) t = 0; else if (t > 1) t = 1;
        dens = Math.pow(t, SPEC.GAMMA);
        if (mode !== 'rec') dens *= 0.5;   // 待機中は控えめ（ほぼ無地）
      }
      const o = y * 4;
      d[o] = BEIGE[0] + (INK[0] - BEIGE[0]) * dens;
      d[o + 1] = BEIGE[1] + (INK[1] - BEIGE[1]) * dens;
      d[o + 2] = BEIGE[2] + (INK[2] - BEIGE[2]) * dens;
      d[o + 3] = 255;
    }
    bctx.putImageData(colImg, whead, 0);
    whead = (whead + 1) % SPEC.COLS;
    totalCols++;
  }
  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = SPEC.SMOOTH;
    // リングバッファを「古い→新しい＝左→右」で2枚に分けて拡大描画（紙送りスクロール）
    const rightCols = SPEC.COLS - whead, wR = rightCols / SPEC.COLS * W;
    ctx.drawImage(buf, whead, 0, rightCols, SPEC.ROWS, 0, 0, wR, H);
    if (whead > 0) ctx.drawImage(buf, 0, 0, whead, SPEC.ROWS, wR, 0, whead / SPEC.COLS * W, H);
    // 本体区間（onset〜offset）を時間軸に投影して赤枠でマーク
    if (bodyStart != null) {
      const base = totalCols - SPEC.COLS;               // 画面左端に対応する列シーケンス
      const sx = (bodyStart - base) / SPEC.COLS * W;
      const ex = ((bodyEnd != null ? bodyEnd : totalCols) - base) / SPEC.COLS * W;
      const x0 = Math.max(1, Math.min(W - 1, sx)), x1 = Math.max(1, Math.min(W - 1, ex));
      if (x1 - x0 >= 1) {
        ctx.strokeStyle = SPEC.BODY_RED; ctx.lineWidth = 1.2;
        ctx.strokeRect(x0 + 0.5, 3.5, (x1 - x0) - 1, H - 7);
      }
    }
  }
  function loop(now) {
    if (!lastColAt) lastColAt = now;
    let added = false, guard = 0;
    while (now - lastColAt >= SPEC.COL_MS && guard < 3) { pushColumn(); lastColAt += SPEC.COL_MS; added = true; guard++; }
    if (guard === 3) lastColAt = now;   // 大きな遅延時は追随して暴走を防ぐ
    if (added) render();
    raf = requestAnimationFrame(loop);
  }
  return {
    // start(getFreqFn, binHz, mode)  mode:'wait'|'rec'
    start(freqFn, hz, m) {
      ensure();
      getFreq = freqFn; binHz = hz || 1; mode = m || 'wait';
      whead = 0; totalCols = 0; lastColAt = 0; bodyStart = null; bodyEnd = null;
      fillBeige(bctx, SPEC.COLS, SPEC.ROWS);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); fillBeige(ctx, W, H);
      document.getElementById('scope-wrap').classList.add('show');
      if (!raf) raf = requestAnimationFrame(loop);
    },
    setMode(m) { mode = m; },
    beginBody() { bodyStart = totalCols; bodyEnd = null; },   // 本体onset（検知時）
    endBody() { bodyEnd = totalCols; },                        // 本体offset（録音終了時）
    stop() {
      if (raf) { cancelAnimationFrame(raf); raf = null; }
      getFreq = null; lastColAt = 0;
      const w = document.getElementById('scope-wrap'); if (w) w.classList.remove('show');
    }
  };
})();

// RMS→dB
function rmsToDb(rms) {
  return rms < 1e-9 ? -100 : 20 * Math.log10(rms);
}

// FFTデータから基音検出（50〜200Hz）
function detectFundamental(fftData, sampleRate, fftSize) {
  const binHz = sampleRate / fftSize;
  const minBin = Math.floor(VALID_FREQ_MIN / binHz);
  const maxBin = Math.ceil(VALID_FREQ_MAX / binHz);
  let maxVal = -Infinity, maxIdx = minBin;
  for (let i = minBin; i <= Math.min(maxBin, fftData.length - 1); i++) {
    if (fftData[i] > maxVal) { maxVal = fftData[i]; maxIdx = i; }
  }
  return maxIdx * binHz;
}

// 50〜200Hz帯の低周波エネルギー（FFTのdB値→線形和）。代表フレーム選定用。
function lowBandEnergy(fftData, sampleRate, fftSize) {
  const binHz = sampleRate / fftSize;
  const minBin = Math.floor(VALID_FREQ_MIN / binHz);
  const maxBin = Math.ceil(VALID_FREQ_MAX / binHz);
  let e = 0;
  for (let i = minBin; i <= Math.min(maxBin, fftData.length - 1); i++) {
    e += Math.pow(10, fftData[i] / 20);
  }
  return e;
}

// Hz→音名インデックス（平均律）
function hzToNoteIndex(hz) {
  // A4=440Hz基準
  const semitones = Math.round(12 * Math.log2(hz / 440));
  return ((semitones % 12) + 12) % 12;
}

// Hz→Hi/Low判定（同音名の中でオクターブ位置）
function hzToHiLow(hz) {
  // 50-100Hz → Low, 100-150Hz → Mid, 150-200Hz → Hi
  if (hz < 100) return -1;
  if (hz > 150) return 1;
  return 0;
}

// YIN法によるF0推定（波形の周期性から基音を直接推定。倍音でなく知覚ピッチを返す）
// centerSample を中心に窓を取り、差分関数→CMND→絶対閾値→放物線補間。
// 返り値: { f0, period }  period=1-aperiodicity（1に近いほど明瞭なピッチ）
function yinF0(samples, centerSample, sampleRate) {
  const tauMax = Math.floor(sampleRate / YIN_F0_MIN);
  const tauMin = Math.max(2, Math.floor(sampleRate / YIN_F0_MAX));
  const need = YIN_W + tauMax;
  let start = Math.round(centerSample - need / 2);
  if (start < 0) start = 0;
  if (start + need > samples.length) start = Math.max(0, samples.length - need);
  const N = Math.min(need, samples.length - start);
  if (N < YIN_W + tauMin + 2) return null;
  const buf = samples.subarray ? samples.subarray(start, start + N) : samples.slice(start, start + N);
  const W = YIN_W;
  const tMax = Math.min(tauMax, N - W - 1);
  if (tMax <= tauMin) return null;

  const d = new Float64Array(tMax + 1);
  for (let tau = 1; tau <= tMax; tau++) {
    let sum = 0;
    for (let j = 0; j < W; j++) { const diff = buf[j] - buf[j + tau]; sum += diff * diff; }
    d[tau] = sum;
  }
  const dp = new Float64Array(tMax + 1);
  dp[0] = 1; let running = 0;
  for (let tau = 1; tau <= tMax; tau++) { running += d[tau]; dp[tau] = running > 0 ? d[tau] * tau / running : 1; }

  let tau = -1;
  for (let t = tauMin; t <= tMax; t++) {
    if (dp[t] < YIN_THRESHOLD) {
      while (t + 1 <= tMax && dp[t + 1] < dp[t]) t++;
      tau = t; break;
    }
  }
  if (tau === -1) {
    let best = tauMin, bv = Infinity;
    for (let t = tauMin; t <= tMax; t++) if (dp[t] < bv) { bv = dp[t]; best = t; }
    tau = best;
  }
  let betterTau = tau;
  if (tau > tauMin && tau < tMax) {
    const s0 = dp[tau - 1], s1 = dp[tau], s2 = dp[tau + 1];
    const denom = s0 - 2 * s1 + s2;
    if (denom !== 0) betterTau = tau + 0.5 * (s0 - s2) / denom;
  }
  return { f0: sampleRate / betterTau, period: Math.max(0, Math.min(1, 1 - dp[tau])) };
}

// period(周期性)→タイプ（暫定・表示しない内部データ）
function periodType(p) {
  return p >= PERIOD_TYPE_HI ? '王子' : p >= PERIOD_TYPE_LO ? '王女' : '野良';
}

// 区間RMS
function rmsRange(samples, from, to) {
  let s = 0;
  for (let i = from; i < to; i++) s += samples[i] * samples[i];
  return Math.sqrt(s / Math.max(1, to - from));
}

// エンベロープ解析（analyze-batch.js と同一）。
// 本体検出は 10ms RMSエンベロープ × ノイズフロア+12dB。環境音のノイズ山を除外する。
function analyzeEnvelope(samples, sampleRate, noiseFloor) {
  const threshold = noiseFloor * Math.pow(10, NOISE_MARGIN_DB / 20);
  const win = Math.max(1, Math.floor(sampleRate * 0.01)); // 10ms
  const hop = Math.max(1, Math.floor(win / 2));
  let onsetIdx = -1, offsetIdx = -1;
  for (let p = 0; p + win <= samples.length; p += hop) {
    if (rmsRange(samples, p, p + win) > threshold) {
      if (onsetIdx < 0) onsetIdx = p;
      offsetIdx = p + win;
    }
  }
  if (onsetIdx < 0 || offsetIdx <= onsetIdx) return null;
  const duration = (offsetIdx - onsetIdx) / sampleRate;

  // キレのよさ：立ち上がりの急峻さ（onset前後20msのエネルギー比率）
  const riseWindow = Math.floor(sampleRate * 0.02);
  let riseRate = 0;
  if (onsetIdx + riseWindow < samples.length) {
    let before = 0, after = 0;
    for (let i = Math.max(0, onsetIdx - riseWindow); i < onsetIdx; i++) before += samples[i] * samples[i];
    before /= riseWindow;
    for (let i = onsetIdx; i < onsetIdx + riseWindow; i++) after += samples[i] * samples[i];
    after /= riseWindow;
    riseRate = before > 0 ? Math.min(after / before, RISE_CAP) : 50;
  }

  // 湿り気：末尾20%のエネルギー比率
  let totalE = 0, tailE = 0;
  const tailStart = onsetIdx + Math.floor((offsetIdx - onsetIdx + 1) * 0.8);
  for (let i = onsetIdx; i <= offsetIdx; i++) {
    const e = samples[i] * samples[i];
    totalE += e;
    if (i >= tailStart) tailE += e;
  }
  const wetRatio = totalE > 0 ? tailE / totalE : 0;

  return { duration, riseRate, wetRatio, onsetIdx, offsetIdx };
}

// スコア計算（analyze-batch.js の確定ロジックと一致）
// peakSampleIndex: 録音全体で低周波エネルギーが最大だった瞬間のバッファ位置（YINの窓中心）
function calcScores(recordedBuffer, sampleRate, fftSnapshot, peakSampleIndex) {
  const samples = recordedBuffer;
  const envelope = analyzeEnvelope(samples, sampleRate, Math.pow(10, noiseFloorDb / 20));
  if (!envelope) return null;

  const { duration, riseRate, wetRatio, onsetIdx, offsetIdx } = envelope;
  if (duration < VALID_DUR_MIN || duration > VALID_DUR_MAX) return null;

  // 大きさ（絶対dB評価・環境非依存）
  const rms = rmsRange(samples, onsetIdx, offsetIdx + 1);
  const db  = rmsToDb(rms);
  const sizeScore = Math.max(0, Math.min(100, (db - SIZE_DB_MIN) / (SIZE_DB_MAX - SIZE_DB_MIN) * 100));

  // 長さ（0.1〜LEN_SCORE_MAX_SEC で正規化。足切りとは別）
  const lengthScore = Math.max(0, Math.min(100, (duration - VALID_DUR_MIN) / (LEN_SCORE_MAX_SEC - VALID_DUR_MIN) * 100));

  // 湿り気（末尾エネルギー比率 → 0〜100）
  const wetScore = Math.max(0, Math.min(100, wetRatio / 0.35 * 100));

  // 重厚感（代表フレームの低域/全域比。AnalyserNodeのdB値→線形和）
  const fftSize = fftSnapshot.length * 2;
  const binHz = sampleRate / fftSize;
  const lowMaxBin = Math.ceil(100 / binHz);
  const highMaxBin = Math.ceil(200 / binHz);
  let lowE = 0, highE = 0;
  for (let i = Math.floor(50/binHz); i <= Math.min(lowMaxBin, fftSnapshot.length-1); i++) {
    lowE += Math.pow(10, fftSnapshot[i] / 20);
  }
  for (let i = lowMaxBin; i <= Math.min(highMaxBin, fftSnapshot.length-1); i++) {
    highE += Math.pow(10, fftSnapshot[i] / 20);
  }
  const totalBandE = lowE + highE;
  const heavyScore = totalBandE > 0 ? Math.max(0, Math.min(100, (lowE / totalBandE) * 100)) : 50;

  // キレ（log10(riseRate) を SHARP_LOG_MIN〜MAX で正規化）
  const sharpScore = Math.max(0, Math.min(100,
    (Math.log10(Math.max(riseRate, 1)) - SHARP_LOG_MIN) / (SHARP_LOG_MAX - SHARP_LOG_MIN) * 100));

  // 安定感（STABLE_WIN_SEC窓RMSのCVを STABLE_CV_MIN〜MAX で正規化）
  const winLen = Math.floor(sampleRate * STABLE_WIN_SEC);
  const rmsList = [];
  for (let i = onsetIdx; i < offsetIdx - winLen; i += winLen) rmsList.push(rmsRange(samples, i, i + winLen));
  let stableScore = 50;
  if (rmsList.length > 1) {
    const mean = rmsList.reduce((s, x) => s + x, 0) / rmsList.length;
    const std  = Math.sqrt(rmsList.reduce((s, x) => s + (x - mean) ** 2, 0) / rmsList.length);
    const cv   = mean > 0 ? std / mean : 1;
    stableScore = Math.max(0, Math.min(100, (STABLE_CV_MAX - cv) / (STABLE_CV_MAX - STABLE_CV_MIN) * 100));
  }

  // 音程：YINでF0推定（倍音でなく知覚ピッチ）。失敗時は代表フレームのピークにフォールバック。
  const center = (peakSampleIndex != null ? peakSampleIndex : (onsetIdx + offsetIdx) / 2);
  const yin = yinF0(samples, center, sampleRate);
  let fundamentalHz, period;
  if (yin && yin.f0 > 0) { fundamentalHz = yin.f0; period = yin.period; }
  else { fundamentalHz = detectFundamental(fftSnapshot, sampleRate, fftSize); period = 0; }

  return {
    size:   Math.round(sizeScore),
    length: Math.round(lengthScore),
    wet:    Math.round(wetScore),
    heavy:  Math.round(heavyScore),
    sharp:  Math.round(sharpScore),
    stable: Math.round(stableScore),
    durationSec: duration,
    dbVal: db,
    noteIdx: hzToNoteIndex(fundamentalHz),
    hilow: hzToHiLow(fundamentalHz),
    hz: fundamentalHz,
    period: +period.toFixed(2),
    type: periodType(period),
  };
}

// ---- メイン処理 ----
btnStart.addEventListener('click', async () => {
  if (state !== 'idle') return;
  btnStart.disabled = true;
  document.getElementById('result').style.display = 'none';
  document.getElementById('invalid-msg').style.display = 'none';

  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    source = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.5;
    source.connect(analyser);

    const fftData  = new Float32Array(analyser.frequencyBinCount);
    const timeData = new Float32Array(analyser.fftSize);

    // ---- Phase 1: ノイズフロア計測 ----
    state = 'measuring';
    setStatus(t('statusMeasuring'), 'status-measure');
    levelWrap.style.display = 'block';

    const noiseRMSList = [];
    const measureStart = Date.now();
    await new Promise(resolve => {
      const measureLoop = () => {
        analyser.getFloatTimeDomainData(timeData);
        const rms = Math.sqrt(timeData.reduce((s, x) => s + x * x, 0) / timeData.length);
        noiseRMSList.push(rms);
        const pct = Math.min(100, ((Date.now() - measureStart) / 2000) * 100);
        levelFill.style.width = pct + '%';
        if (Date.now() - measureStart < 2000) requestAnimationFrame(measureLoop);
        else resolve();
      };
      requestAnimationFrame(measureLoop);
    });

    const noiseRMS = noiseRMSList.reduce((s, x) => s + x, 0) / noiseRMSList.length;
    noiseFloorDb = rmsToDb(noiseRMS);
    const threshold = noiseRMS * Math.pow(10, NOISE_MARGIN_DB / 20);

    // ---- Phase 2: 待機 ----
    state = 'waiting';
    setStatus(t('statusWaiting'), 'status-wait');
    levelFill.style.width = '0%';
    levelFill.style.background = '#2a9d8f';
    // レベルバーを声紋モニタに格上げ（待機中は薄い記録面のみ、録音でFFTが刻まれる）
    levelWrap.style.display = 'none';
    const freqBuf = new Float32Array(analyser.frequencyBinCount);
    const specBinHz = audioCtx.sampleRate / analyser.fftSize;
    Scope.start(() => { analyser.getFloatFrequencyData(freqBuf); return freqBuf; }, specBinHz, 'wait');

    // 録音バッファ
    const recordedSamples = [];
    let isRecording = false;
    let silenceFrames = 0;
    const SILENCE_FRAMES = 20; // 無音継続フレーム数で終了
    let fftSnapshot = null;
    let peakSampleIndex = 0;       // 低周波エネルギー最大の瞬間のバッファ位置（YIN窓中心）
    let maxLowEnergy = -Infinity;  // 録音全体での低周波エネルギー最大値（代表フレーム選定用）
    let startTime = null;

    await new Promise((resolve, reject) => {
      const loop = () => {
        if (state === 'idle') { resolve(); return; }

        analyser.getFloatTimeDomainData(timeData);
        analyser.getFloatFrequencyData(fftData);

        const rms = Math.sqrt(timeData.reduce((s, x) => s + x * x, 0) / timeData.length);
        const pct = Math.min(100, (rms / threshold) * 60);
        levelFill.style.width = pct + '%';

        if (!isRecording) {
          if (rms > threshold) {
            // 検知
            isRecording = true;
            state = 'recording';
            startTime = Date.now();
            setStatus(t('statusRecording'), 'status-rec');
            Scope.setMode('rec');
            Scope.beginBody();   // 本体onset：声紋に赤枠の左端を立てる
            recordedSamples.push(...timeData);
            // 代表フレーム（低周波エネルギー最大）の初期化
            maxLowEnergy = lowBandEnergy(fftData, audioCtx.sampleRate, analyser.fftSize);
            fftSnapshot = fftData.slice();
            peakSampleIndex = recordedSamples.length - Math.floor(analyser.fftSize / 2);
          }
        } else {
          recordedSamples.push(...timeData);
          // 録音全体で低周波エネルギーが最大の瞬間を代表フレームとして採用（基音・重厚感はここから確定）
          const le = lowBandEnergy(fftData, audioCtx.sampleRate, analyser.fftSize);
          if (le > maxLowEnergy) {
            maxLowEnergy = le;
            fftSnapshot = fftData.slice();
            peakSampleIndex = recordedSamples.length - Math.floor(analyser.fftSize / 2);
          }
          if (rms < threshold * 0.6) {
            silenceFrames++;
            if (silenceFrames > SILENCE_FRAMES) { resolve(); return; }
          } else {
            silenceFrames = 0;
          }
          // 上限10秒
          if (Date.now() - startTime > 10000) { resolve(); return; }
        }
        requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);
    });

    state = 'done';
    setStatus(t('statusAnalyzing'), 'status-measure');
    Scope.endBody();   // 本体offset：赤枠の右端を確定

    // クリーンアップ
    stream.getTracks().forEach(t => t.stop());
    levelWrap.style.display = 'none';
    Scope.stop();

    if (recordedSamples.length === 0) {
      setStatus(t('errNoSound'), 'status-error');
      document.getElementById('invalid-msg').style.display = 'block';
      state = 'idle';
      btnStart.disabled = false;
      return;
    }

    const scores = calcScores(
      new Float32Array(recordedSamples),
      audioCtx.sampleRate,
      fftSnapshot || fftData,
      peakSampleIndex
    );

    if (!scores) {
      setStatus(t('errNoFart'), 'status-error');
      document.getElementById('invalid-msg').style.display = 'block';
      state = 'idle';
      btnStart.disabled = false;
      return;
    }

    // 表示
    displayResult(scores);

  } catch (e) {
    setStatus(t('errMicDenied'), 'status-error');
    Scope.stop();
    btnStart.disabled = false;
    state = 'idle';
  }
});

function logResult(s) {
  const logEl = document.getElementById('log-status');
  const payload = {
    note:      NOTES[s.noteIdx],
    noteIdx:   s.noteIdx,
    zodiac:    ZODIACS[s.noteIdx],
    hilow:     s.hilow,
    hz:        +s.hz.toFixed(1),
    duration:  +s.durationSec.toFixed(3),
    db:        +s.dbVal.toFixed(1),
    noiseFloor: +noiseFloorDb.toFixed(1),
    size:      s.size,
    length:    s.length,
    wet:       s.wet,
    heavy:     s.heavy,
    sharp:     s.sharp,
    stable:    s.stable,
    period:    s.period,   // 周期性（内部データ・結果画面には非表示）
    type:      s.type,     // period由来のタイプ（暫定・非表示）
    ua:        navigator.userAgent,
  };
  // 内部データはコンソールにも出す（periodやtypeの確認用）
  console.log('[onara] result', payload);
  // 母集団CSV記録は開発用サーバー(/api/log)のみ。公開ホスティングでは無い→静かに無視。
  if (logEl) logEl.textContent = '';
  fetch('/api/log', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  })
    .then(r => r.json())
    .then(d => { if (logEl) logEl.textContent = ''; })
    .catch(e => { if (logEl) logEl.textContent = ''; });
}

function ensureSpecies(zi, cb) {

// ---- レーダーチャート ----
function drawRadar(v) { drawRadarInto(document.getElementById('radar'), v); }
function drawRadarInto(canvas, v) {
  const ctx = canvas.getContext('2d');
  const W=canvas.width, H=canvas.height, cx=W/2, cy=H/2, R=W*0.38;
  ctx.clearRect(0,0,W,H);
  const labels = t('radarLabels');
  const values = [v.size,v.length,v.wet,v.heavy,v.sharp,v.stable];
  const n=6;
  const angle = i => Math.PI*2/n*i - Math.PI/2;
  const pt = (i,r) => ({ x: cx+r*Math.cos(angle(i)), y: cy+r*Math.sin(angle(i)) });
  for(let g=1;g<=4;g++){
    ctx.beginPath();
    for(let i=0;i<n;i++){const p=pt(i,R*g/4);i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);}
    ctx.closePath(); ctx.strokeStyle='#ddd'; ctx.lineWidth=1; ctx.stroke();
  }
  for(let i=0;i<n;i++){const p=pt(i,R);ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(p.x,p.y);ctx.strokeStyle='#ddd';ctx.lineWidth=1;ctx.stroke();}
  ctx.beginPath();
  for(let i=0;i<n;i++){const p=pt(i,R*values[i]/100);i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);}
  ctx.closePath(); ctx.fillStyle='rgba(42,42,42,0.15)'; ctx.fill();
  ctx.strokeStyle='#2a2a2a'; ctx.lineWidth=2; ctx.stroke();
  for(let i=0;i<n;i++){const p=pt(i,R*values[i]/100);ctx.beginPath();ctx.arc(p.x,p.y,3.5,0,Math.PI*2);ctx.fillStyle='#2a2a2a';ctx.fill();}
  ctx.fillStyle='#2a2a2a'; ctx.font='bold 12px "Hiragino Sans",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  for(let i=0;i<n;i++){const p=pt(i,R+16);ctx.fillText(labels[i],p.x,p.y);}
}

function drawRadarEmpty() {
  const canvas = document.getElementById('radar');

  ctx.clearRect(0,0,canvas.width,canvas.height);
}

// ===== シェア画像生成（純SVG合成→PNG。html2canvas不使用でキャラのSVGフィルタも忠実に焼き込む） =====
// 診断3ページ目・個体詳細のどちらから呼んでも、同じ「全部入り」カード
// （動物名＋タイプバッジ／キャラ／レーダー／診断諸元＋アプリ名・URL）を生成する。
const SHARE_URL = 'tamototrinity-del.github.io/onara-radar';
const CARD_W = 560, CARD_H = 820, CARD_SCALE = 2;
const CARD_FONT = "'Hiragino Sans','Yu Gothic',sans-serif";
function xesc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// レーダーをSVGマークアップで（キャンバス版と同じ幾何。1枚合成のため）
function radarSVGInner(cx, cy, R, values){
  const n=6, labels=t('radarLabels');
  const ang=i=>Math.PI*2/n*i - Math.PI/2;
  const P=(i,r)=>[cx+r*Math.cos(ang(i)), cy+r*Math.sin(ang(i))];
  let s='';
  for(let g=1;g<=4;g++){ let d=''; for(let i=0;i<n;i++){ const p=P(i,R*g/4); d+=(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1); } d+='Z'; s+=`<path d="${d}" fill="none" stroke="#ddd" stroke-width="1"/>`; }
  for(let i=0;i<n;i++){ const p=P(i,R); s+=`<line x1="${cx}" y1="${cy}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}" stroke="#ddd" stroke-width="1"/>`; }
  let d=''; for(let i=0;i<n;i++){ const p=P(i,R*values[i]/100); d+=(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1); } d+='Z';
  s+=`<path d="${d}" fill="rgba(42,42,42,0.15)" stroke="#2a2a2a" stroke-width="2"/>`;
  for(let i=0;i<n;i++){ const p=P(i,R*values[i]/100); s+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="#2a2a2a"/>`; }
  for(let i=0;i<n;i++){ const p=P(i,R+18); s+=`<text x="${p[0].toFixed(1)}" y="${(p[1]+4).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a2a2a">${xesc(labels[i])}</text>`; }
  return s;
}

// 住人エントリ（entry）＋キャラSVG内部マークアップ から共有カードSVG文字列を作る
function buildShareSVG(entry, charInner){
  const zi = ((entry.noteIdx%12)+12)%12;
  const animal  = ANIMALS[zi];
  const typeTxt = typeLabel(entry.type);
  const typeCol = DEX_TYPECOL[entry.type] || '#999';
  const noteTxt = NOTES[zi] + hlStr(entry);
  const rows = [
    [t('specNote'),   noteTxt],
    [t('specType'),   t('typeWithPeriod', typeTxt, (entry.period!=null?(+entry.period).toFixed(2):'-'))],
    [t('specSize'),   entry.dbVal!=null? fmtDb(+entry.dbVal) : (entry.size+' %')],
    [t('specLength'), entry.durationSec!=null? (+entry.durationSec).toFixed(2)+' s' : (entry.length+' %')],
    [t('specWet'),    entry.wet+' %'],
    [t('specHeavy'),  entry.heavy+' %'],
    [t('specSharp'),  entry.sharp+' pt'],
    [t('specStable'), entry.stable+' %'],
  ];
  // 見出し（動物名＋タイプバッジ）を中央寄せ（全角想定の概算幅で配置）
  const nameFS=34, badgeW=64, badgeH=30, gap=12, hy=58;
  const nameW = animal.length * nameFS * 0.94;
  const total = nameW + gap + badgeW;
  const hx = Math.max(28, (CARD_W - total)/2);
  const bx = hx + nameW + gap, byTop = hy - badgeH + 4;
  let head = `<text x="${hx.toFixed(1)}" y="${hy}" font-size="${nameFS}" font-weight="800" fill="#2a2a2a">${xesc(animal)}</text>`
    + `<rect x="${bx.toFixed(1)}" y="${byTop}" rx="12" ry="12" width="${badgeW}" height="${badgeH}" fill="${typeCol}"/>`
    + `<text x="${(bx+badgeW/2).toFixed(1)}" y="${byTop+badgeH/2+5}" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">${xesc(typeTxt)}</text>`;
  // 諸元テーブル
  const sx=28, sw=CARD_W-56, sy=520, titleH=32, rowH=28;
  let specs = `<rect x="${sx}" y="${sy}" width="${sw}" height="${titleH+rowH*rows.length}" rx="8" ry="8" fill="#fff" stroke="#e0ddd8" stroke-width="1"/>`
    + `<path d="M${sx} ${sy+8} a8 8 0 0 1 8 -8 h${sw-16} a8 8 0 0 1 8 8 v${titleH-8} h${-sw} Z" fill="#2a2a2a"/>`
    + `<text x="${sx+sw/2}" y="${sy+titleH/2+4}" text-anchor="middle" font-size="12" letter-spacing="1.5" fill="#fff">${xesc(t('specsTitle'))}</text>`;
  rows.forEach((r,i)=>{
    const ry = sy+titleH+rowH*i;
    if(i>0) specs += `<line x1="${sx+14}" y1="${ry}" x2="${sx+sw-14}" y2="${ry}" stroke="#eae6df" stroke-width="1"/>`;
    specs += `<text x="${sx+16}" y="${ry+rowH/2+5}" font-size="15" font-weight="600" fill="#2e2e2e">${xesc(r[0])}</text>`
      + `<text x="${sx+sw-16}" y="${ry+rowH/2+5}" text-anchor="end" font-size="15" font-weight="700" fill="#1a1a1a">${xesc(r[1])}</text>`;
  });
  const rvals = [entry.size,entry.length,entry.wet,entry.heavy,entry.sharp,entry.stable];
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${CARD_W} ${CARD_H}" width="${CARD_W*CARD_SCALE}" height="${CARD_H*CARD_SCALE}" font-family="${CARD_FONT}">`
    + `<rect width="${CARD_W}" height="${CARD_H}" fill="#f7f5f0"/>`
    + head
    + `<svg x="180" y="84" width="200" height="200" viewBox="-100 -100 200 200" xmlns="http://www.w3.org/2000/svg">${charInner}</svg>`
    + radarSVGInner(280, 395, 92, rvals)
    + specs
    + `<text x="28" y="800" font-size="16" font-weight="800" fill="#2a2a2a">${xesc(t('appTitle'))}</text>`
    + `<text x="${CARD_W-28}" y="800" text-anchor="end" font-size="13" fill="#8a8378">${xesc(SHARE_URL)}</text>`
    + `</svg>`;
}

// entry → PNG Blob（キャラのトレースデータをロードしてからSVG合成→data URI→canvas）
function renderCardBlob(entry){
  return new Promise((resolve, reject)=>{
    const zi = ((entry.noteIdx%12)+12)%12;
    ensureSpecies(zi, (err)=>{
      let charInner = '';
      if(!err && window.CharaTrace){ charInner = CharaTrace.charaTraceSVG(entry, zi, 'share'+Date.now()) || ''; }
      if(!charInner && window.Chara){ charInner = Chara.charaSVG(entry, zi, 'share'); }
      const svg = buildShareSVG(entry, charInner);
      const img = new Image();
      img.onload = ()=>{
        try{
          const canvas = document.createElement('canvas');
          canvas.width = CARD_W*CARD_SCALE; canvas.height = CARD_H*CARD_SCALE;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          canvas.toBlob(b => b ? resolve(b) : reject(new Error('toBlob returned null')), 'image/png');
        }catch(e){ reject(e); }
      };
      img.onerror = ()=> reject(new Error('SVG画像の読み込みに失敗'));
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    });
  });
}

// シェア実行：Web Share API（画像ファイル対応）→ 非対応時はPNGダウンロード
async function shareCard(entry){
  if(!entry){ return; }
  flashReg(t('sharePreparing'));
  let blob;
  try { blob = await renderCardBlob(entry); }
  catch(e){ console.error('[onara] share render failed', e); flashReg(t('shareFailed')); return; }
  flashReg('');
  const fname = 'onara-radar.png';
  const file = new File([blob], fname, { type:'image/png' });
  const text = t('shareText', ANIMALS[((entry.noteIdx%12)+12)%12], typeLabel(entry.type)) + '\n' + 'https://' + SHARE_URL;
  if (navigator.canShare && navigator.canShare({ files:[file] })){
    try { await navigator.share({ files:[file], text }); return; }
    catch(e){ if(e && e.name==='AbortError') return; console.warn('[onara] navigator.share failed, fallback to download', e); }
  }
  // フォールバック：ダウンロード
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = fname;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

document.getElementById('btn-dex-open').addEventListener('click', openDex);
document.getElementById('dex-close').addEventListener('click', closeDex);
document.getElementById('detail-close').addEventListener('click', closeDetail);
document.getElementById('btn-dex-register').addEventListener('click', registerCurrent);
document.getElementById('btn-share-result').addEventListener('click', ()=>{ if(lastScores) shareCard(scoreToEntry(lastScores)); });
document.getElementById('btn-share-detail').addEventListener('click', ()=>{ if(detailEntry) shareCard(detailEntry); });
document.getElementById('swap-yes').addEventListener('click', ()=>doSwap(true));
document.getElementById('swap-no').addEventListener('click', ()=>doSwap(false));

// 静的UIテキストを辞書から流し込む（data-i18n を持つ全要素＋<title>）
applyStaticText();
